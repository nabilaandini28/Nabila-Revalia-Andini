<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="60%" stop-color="#144272"/>
      <stop offset="100%" stop-color="#1E6FD9"/>
    </linearGradient>
    <filter id="playGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1E6FD9" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#posterGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Big Decorative Circles -->
  <circle cx="150" cy="150" r="180" fill="#1E6FD9" fill-opacity="0.15"/>
  <circle cx="1150" cy="600" r="220" fill="#DCEBFF" fill-opacity="0.1"/>

  <!-- Play Button -->
  <circle cx="640" cy="340" r="75" fill="#FFFFFF" filter="url(#playGlow)"/>
  <polygon points="625,305 675,340 625,375" fill="#1E6FD9"/>

  <!-- Video Title & Caption -->
  <text x="640" y="470" text-anchor="middle" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="700" font-size="34">VIDEO PERKENALAN &amp; TUR RUMAH</text>
  <text x="640" y="520" text-anchor="middle" fill="#DCEBFF" font-family="'Poppins', sans-serif" font-weight="400" font-size="20">Klik Tombol Putar (Play) untuk Memulai Video</text>
  <text x="640" y="650" text-anchor="middle" fill="#93C5FD" font-family="'Poppins', sans-serif" font-weight="500" font-size="16">File sumber: assets/video_profil.mp4 (atau YouTube Embed)</text>
</svg>